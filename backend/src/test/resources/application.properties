# In-memory database for tests
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Stub Google OAuth2 for tests (no real network calls made)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.provider.google.authorization-uri=http://localhost:1/authorize
spring.security.oauth2.client.provider.google.token-uri=http://localhost:1/oauth/token
spring.security.oauth2.client.provider.google.user-info-uri=http://localhost:1/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=http://localhost:1/.well-known/jwks.json
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# JWT
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3Rpbmctb25seQ==
app.jwt.expiration=3600000

# Internal API
app.internal.api.secret=test-secret

# Stripe
stripe.secret.key=sk_test_PLACEHOLDER
stripe.webhook.secret=whsec_PLACEHOLDER

# Billing URLs
app.billing.success-url=http://localhost:5173/billing/success
app.billing.cancel-url=http://localhost:5173/billing/cancel
app.billing.portal-return-url=http://localhost:5173/billing/portal-return

# Redis (Lettuce connects lazily, so context loads without a live server)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Mail (disabled for tests)
spring.mail.host=localhost
spring.mail.port=25
app.mail.from=test@test.com
