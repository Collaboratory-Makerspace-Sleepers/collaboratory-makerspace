# PostgreSQL
#will add globals later 
spring.application.name=backend
spring.datasource.url=jdbc:postgresql://makerspace-db.cx0ik0cea7ks.us-east-2.rds.amazonaws.com:5432/collab_app
spring.datasource.username=user
spring.datasource.password=postgres
spring.security.user.name=user
spring.security.user.password=password
spring.flyway.baseline-on-migrate=true
spring.flyway.ignore-migration-patterns=*:missing

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#S3 properties 
# aws.s3.bucket=collaboratory-makerspace-backend-artifacts
# aws.region=us-east-2

# Google Login

logging.level.org.springframework.security=TRACE
spring.security.oauth2.client.registration.google.client-id=846303387091-as0ru06v3q6h38l4sj6240sk0h8tuiur.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:placeholder-google-secret}

# Microsoft (covers Outlook, Hotmail, Live)
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:placeholder-microsoft}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:placeholder-secret}
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# Apple
spring.security.oauth2.client.registration.apple.client-id=${APPLE_CLIENT_ID:placeholder-apple}
spring.security.oauth2.client.registration.apple.client-secret=${APPLE_CLIENT_SECRET:placeholder-secret}
spring.security.oauth2.client.registration.apple.scope=openid,name,email
spring.security.oauth2.client.registration.apple.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.apple.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.apple.authorization-uri=https://appleid.apple.com/auth/authorize?response_mode=form_post
spring.security.oauth2.client.provider.apple.token-uri=https://appleid.apple.com/auth/token
spring.security.oauth2.client.provider.apple.jwk-set-uri=https://appleid.apple.com/auth/keys
spring.security.oauth2.client.provider.apple.user-name-attribute=sub

app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-key-0123456789abcdefghij}
app.jwt.expiration=3600000

# Redis (OTP storage)
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail / SMTP
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@makerspace.local}