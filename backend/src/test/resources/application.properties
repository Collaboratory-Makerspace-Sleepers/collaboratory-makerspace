# In-memory database for tests
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Stub Google OAuth2 for tests (no real network calls made)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.provider.google.authorization-uri=http://localhost:1/authorize
spring.security.oauth2.client.provider.google.token-uri=http://localhost:1/oauth/token
spring.security.oauth2.client.provider.google.user-info-uri=http://localhost:1/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=http://localhost:1/.well-known/jwks.json
spring.security.oauth2.client.provider.google.user-name-attribute=sub

