# In-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Okta auto-configuration for tests
#okta.oauth2.issuer=https://test.example.com/
#okta.oauth2.client-id=test-client-id
#okta.oauth2.client-secret=test-client-secret
spring.security.oauth2.client.registration.okta.client-id=test-client-id
spring.security.oauth2.client.registration.okta.client-secret=test-client-secret
spring.security.oauth2.client.registration.okta.scope=openid,profile,email
spring.security.oauth2.client.registration.okta.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.okta.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.okta.authorization-uri=http://localhost:1/authorize
spring.security.oauth2.client.provider.okta.token-uri=http://localhost:1/oauth/token
spring.security.oauth2.client.provider.okta.user-info-uri=http://localhost:1/userinfo
spring.security.oauth2.client.provider.okta.jwk-set-uri=http://localhost:1/.well-known/jwks.json
spring.security.oauth2.client.provider.okta.user-name-attribute=sub

